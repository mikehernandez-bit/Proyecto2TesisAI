<div id="modal-manual-config" class="fixed inset-0 z-[60] hidden modal-backdrop flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-5xl transform transition-all scale-100 flex flex-col max-h-[90vh] overflow-hidden border border-slate-200">

    <!-- HEADER -->
    <div class="px-8 py-6 bg-slate-900 text-white shrink-0">
      <div class="flex justify-between items-start mb-6">
        <div class="flex items-center gap-5">
          <div id="manual-logo-container" class="w-14 h-14 bg-white rounded-2xl p-1.5 flex items-center justify-center shadow-inner overflow-hidden">
            <img id="manual-logo-img" src="" alt="" class="w-full h-full object-contain hidden">
          </div>
          <div>
            <div class="flex items-center gap-3">
              <h3 id="manual-title-display" class="text-2xl font-black tracking-tight uppercase">—</h3>
              <span class="px-2.5 py-0.5 bg-blue-500/20 text-blue-300 text-[10px] font-black rounded-full border border-blue-500/30 uppercase tracking-widest">Admin Mode</span>
            </div>
            <p id="manual-subtitle-display" class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">—</p>
          </div>
        </div>
        <button onclick="closeManualModal()"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-all">
          <i class="fa-solid fa-xmark fa-lg"></i>
        </button>
      </div>

      <div class="flex flex-col gap-2 p-4 bg-slate-800/40 rounded-2xl border border-slate-700/50">
        <label class="text-[10px] font-black text-blue-400 uppercase tracking-widest ml-1">Identificador del paquete:</label>
        <input type="text" id="manual-prompt-name"
          class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-semibold text-white placeholder:text-slate-500 focus:outline-none focus:border-blue-500 transition-all"
          placeholder="Ej: promptpkg_unac_informe_cual">
      </div>
    </div>
    <!-- END HEADER -->

    <!-- BODY -->
    <div class="p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/30">
      <div class="space-y-8">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm space-y-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center">
              <i class="fa-solid fa-layer-group"></i>
            </div>
            <div>
              <h4 class="text-sm font-black uppercase tracking-widest text-slate-800">Prompt base del paquete</h4>
              <p class="text-xs text-slate-500">Contexto global que se combinará con los bloques de la sección seleccionada.</p>
            </div>
          </div>
          <textarea id="package-base-template" rows="4"
            class="w-full rounded-3xl border-2 border-slate-200 bg-slate-50 px-5 py-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10"
            placeholder="Describe el contexto general del paquete institucional..."></textarea>
        </div>

        <div id="prompts-container" class="space-y-6"></div>

        <div class="pt-2">
          <button onclick="addPromptBlock()"
            class="w-full py-5 border-2 border-dashed border-slate-300 rounded-3xl text-slate-400 font-black text-sm uppercase tracking-[0.2em] hover:border-emerald-400 hover:text-emerald-600 hover:bg-emerald-50 transition-all flex items-center justify-center gap-3 group">
            <i class="fa-solid fa-plus-circle fa-lg group-hover:scale-125 transition-transform"></i> Añadir bloque de prompt
          </button>
        </div>
      </div>
    </div>
    <div class="px-8 py-5 bg-white border-t border-slate-100 flex justify-end gap-4 shrink-0">
      <button onclick="closeManualModal()"
        class="px-6 py-2.5 text-sm font-bold text-slate-500 hover:text-slate-800 transition">
        Descartar
      </button>
      <button onclick="savePackage()"
        class="px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-black rounded-2xl shadow-xl shadow-blue-200 transition-all transform active:scale-95 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i> Guardar Paquete
      </button>
    </div>
  </div>
</div>
