<div id="modal-manual-config" class="fixed inset-0 z-[60] hidden modal-backdrop flex items-center justify-center p-4 sm:p-6">
  <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-[1120px] transform transition-all scale-100 flex flex-col max-h-[92vh] overflow-hidden border border-slate-200">

    <!-- HEADER -->
    <div class="px-8 py-6 bg-slate-900 text-white shrink-0">
      <div class="flex justify-between items-start mb-6">
        <div class="flex items-center gap-5">
          <div id="manual-logo-container" class="w-14 h-14 bg-white rounded-2xl p-1.5 flex items-center justify-center shadow-inner overflow-hidden">
            <img id="manual-logo-img" src="" alt="" class="w-full h-full object-contain hidden">
          </div>
          <div>
            <div class="flex items-center gap-3">
              <h3 id="manual-title-display" class="text-2xl font-black tracking-tight uppercase">-</h3>
              <span class="px-2.5 py-0.5 bg-blue-500/20 text-blue-300 text-[10px] font-black rounded-full border border-blue-500/30 uppercase tracking-widest">Admin Mode</span>
            </div>
            <p id="manual-subtitle-display" class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">-</p>
          </div>
        </div>
        <button onclick="closeManualModal()"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-all">
          <i class="fa-solid fa-xmark fa-lg"></i>
        </button>
      </div>

      <div class="flex flex-col gap-2 p-4 bg-slate-800/40 rounded-2xl border border-slate-700/50">
        <label class="text-[10px] font-black text-blue-400 uppercase tracking-widest ml-1">Nombre identificador del prompt:</label>
        <input type="text" id="manual-prompt-name"
          class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-semibold text-white placeholder:text-slate-500 focus:outline-none focus:border-blue-500 transition-all"
          placeholder="Ej: UNAC_INF_CUALI_CAPITULO_I">
      </div>
    </div>
    <!-- END HEADER -->

    <!-- BODY -->
    <div class="p-6 md:p-8 overflow-y-auto custom-scrollbar flex-1 bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.08),_transparent_38%),linear-gradient(180deg,_#f8fafc_0%,_#ffffff_22%,_#f8fafc_100%)]">
      <div class="space-y-8">
        <div id="prompts-container" class="space-y-6"></div>

        <div class="pt-1">
          <button onclick="addPromptBlock()"
            class="w-full py-5 border-2 border-dashed border-slate-300 rounded-[2rem] text-slate-400 font-black text-sm uppercase tracking-[0.2em] hover:border-emerald-400 hover:text-emerald-600 hover:bg-emerald-50 transition-all flex items-center justify-center gap-3 group">
            <i class="fa-solid fa-plus-circle fa-lg group-hover:scale-125 transition-transform"></i> A&ntilde;adir bloque de prompt
          </button>
        </div>
      </div>
    </div>
    <div class="px-8 py-5 bg-white border-t border-slate-100 flex justify-end gap-4 shrink-0">
      <button onclick="closeManualModal()"
        class="px-6 py-2.5 text-sm font-bold text-slate-500 hover:text-slate-800 transition">
        Descartar
      </button>
      <button onclick="savePackage()"
        class="px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-black rounded-2xl shadow-xl shadow-blue-200 transition-all transform active:scale-95 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i> Guardar Paquete
      </button>
    </div>
  </div>
</div>
