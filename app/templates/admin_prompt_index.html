<div id="view-prompt-index" class="view-section hidden fade-in">
  
  <div class="flex items-center gap-4 mb-8">
    <button onclick="TesisAI.showView('admin-prompts')" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight" id="index-title">UNAC - Informe Tesis</h1>
      <p class="text-slate-500 text-sm font-medium mt-1" id="index-subtitle">Metodología: CUALITATIVA</p>
    </div>
  </div>

  <div class="max-w-4xl mx-auto">
    <div id="index-blocks-container" class="space-y-4">
      
      <div onclick="openManualModal(1)" class="bg-white border border-slate-200 rounded-2xl p-5 flex items-center justify-between cursor-pointer hover:border-blue-400 hover:shadow-md transition-all group">
        <div class="flex items-center gap-4 w-full">
          <div class="w-12 h-12 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center font-black text-lg group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">
            1
          </div>
          
          <div class="flex-1">
            <h4 class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Capítulo I</h4>
            <input type="text" 
              placeholder="Ej: Introducción y Planteamiento del Problema" 
              onclick="event.stopPropagation()" 
              class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 placeholder:text-slate-400 focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-blue-50 transition-all outline-none"
            >
          </div>

          <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-500 transition-colors ml-3"></i>
        </div>
      </div>

    </div>

    <div class="mt-6">
      <button onclick="createNewChapter()" class="w-full py-5 border-2 border-dashed border-slate-300 rounded-2xl text-slate-500 font-black text-sm uppercase tracking-widest hover:border-emerald-400 hover:text-emerald-600 hover:bg-emerald-50 transition-all flex items-center justify-center gap-3">
        <i class="fa-solid fa-plus-circle fa-lg"></i> Añadir Nuevo Capítulo
      </button>
    </div>
  </div>
</div>
